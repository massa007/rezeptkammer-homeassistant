name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      # Ohne "ignore": fuer die Aufnahme in den Marketplace-Katalog muss die Pruefung ohne Ausnahmen
      # bestehen; das Logo liegt in custom_components/rezeptkammer/brand/
      - uses: hacs/action@main
        with:
          category: integration
