blueprint:
  name: RezeptKammer – Küchenlicht beim Kochen
  description: Schaltet das Küchenlicht ein, sobald du ein Rezept im Kochmodus der RezeptKammer öffnest.
  domain: automation
  source_url: https://rezeptkammer.de/ha/blueprints/kochmodus_licht.yaml
  input:
    lights:
      name: Licht
      selector:
        target:
          entity:
            domain: light
    brightness:
      name: Helligkeit
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
mode: single
triggers:
  - trigger: event
    event_type: rezeptkammer_event
    event_data:
      type: cooking_started
actions:
  - action: light.turn_on
    target: !input lights
    data:
      brightness_pct: !input brightness
